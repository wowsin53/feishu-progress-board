# fs IP-based virtual host; future domains can use their own independent server blocks.
server {
    listen 80;
    server_name 47.93.156.196;
    root /opt/fs/current/dist;
    index index.html;
    access_log /var/log/nginx/fs.access.log;
    error_log /var/log/nginx/fs.error.log;
    add_header X-Content-Type-Options nosniff always;
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
    location /api/ {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:18081/healthz;
    }
}
